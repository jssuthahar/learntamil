# Runs the same checks as `npm run check` on every push and pull request.
# GitHub Pages serves main directly, so a red check here means: do not merge.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Build pages, styles, sitemap, llms.txt, service worker lists
        run: npm run build
      - name: Smoke test + SEO guard (headless Chrome)
        run: npm test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
